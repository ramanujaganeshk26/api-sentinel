plugins {
    id 'java'
    id 'application'
}

group = 'com.apisentinel'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.apisentinel.App'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.apisentinel.App',
            'Implementation-Title': 'APISentinel',
            'Implementation-Version': project.version
        )
    }
}
